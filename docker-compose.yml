version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: radar-postgres
    restart: always
    environment:
      POSTGRES_DB: vagasdiscord
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Isso garante que as vagas salvas não sumam se o servidor reiniciar!

  discord-bot:
    build: .
    container_name: radar-vagas-bot
    restart: always
    depends_on:
      - db
    env_file:
      - .env

volumes:
  postgres_data: