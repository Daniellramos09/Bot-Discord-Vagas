version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: radar-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  discord-bot:
    build: .
    container_name: radar-vagas-bot
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATASOURCE_HOST: db
      DATASOURCE_PORT: 5432
      DATASOURCE_DATABASE: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      DATASOURCE_USERNAME: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}

volumes:
  postgres_data:
