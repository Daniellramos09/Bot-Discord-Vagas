spring.application.name=DiscordVagas
spring.profiles.default=prod

# O perfil dev deve ser ativado explicitamente para expor os endpoints manuais.
# Em producao, use SPRING_PROFILES_ACTIVE=prod.

# No Render, estas variaveis sao preenchidas pelo banco privado.
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://${DATASOURCE_HOST:localhost}:${DATASOURCE_PORT:5432}/${DATASOURCE_DATABASE:discord_vagas}}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

gemini.api.key=${GEMINI_API_KEY}
discord.webhook.url=${DISCORD_WEBHOOK_URL}
discord.webhook.url.openSource=${DISCORD_WEBHOOK_URL_OPENSOURCE}
discord.webhook.url.certificacao=${DISCORD_WEBHOOK_URL_CERTIFICACAO}
discord.webhook.url.curso=${DISCORD_WEBHOOK_URL_CURSO}
discord.webhook.url.evento=${DISCORD_WEBHOOK_URL_EVENTO}
discord.webhook.url.ferramentas=${DISCORD_WEBHOOK_URL_FERRAMENTAS}

buscador.vagas.jooble=${BUSCADOR_VAGAS}
buscador.vaga.serpapi=${BUSCADOR_VAGA_SERP}
buscador.vaga.serperapi=${BUSCADOR_VAGA_SERPER}

resttemplate.connect-timeout-ms=${RESTTEMPLATE_CONNECT_TIMEOUT_MS:5000}
resttemplate.read-timeout-ms=${RESTTEMPLATE_READ_TIMEOUT_MS:30000}
vagas.max-per-run=${VAGAS_MAX_PER_RUN:5}
github.language-filter=${GITHUB_LANGUAGE_FILTER:java}
github.max-issues-per-run=${GITHUB_MAX_ISSUES_PER_RUN:5}
ferramentas.max-repos-per-run=${FERRAMENTAS_MAX_REPOS_PER_RUN:30}
app.security.api-key=${APP_SECURITY_API_KEY}

# Render informa a porta HTTP por esta variavel. O valor padrao preserva a
# execucao local e em outros provedores, como a AWS.
server.address=0.0.0.0
server.port=${PORT:8080}
